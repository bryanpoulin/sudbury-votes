<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald Radial Glow -->
    <radialGradient id="emeraldGlow" cx="50%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Headline Gradient -->
    <linearGradient id="textEmeraldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Input Box Shadow -->
    <filter id="inputShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- CTA Button Glow -->
    <filter id="btnShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#darkBg)" rx="24" />
  <rect width="600" height="600" fill="url(#emeraldGlow)" rx="24" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="596" height="596" rx="22" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.8" />

  <!-- Content Container -->
  <g transform="translate(40, 42)">
    
    <!-- Top Pill / Status Bar -->
    <g>
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
      <!-- Pulsing Green Dot -->
      <circle cx="20" cy="17" r="5" fill="#34d399" />
      <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1.2">
        COMMUNITY PRIORITIES BOARD
      </text>
    </g>

    <!-- All 12 Wards Badge -->
    <text x="520" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5" text-anchor="end">
      ALL 12 WARDS
    </text>

    <!-- Headline -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
        YOUR WARD. YOUR VOICE.
      </text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="41" font-weight="900" fill="url(#textEmeraldGradient)" letter-spacing="-0.5">
        YOUR PRIORITIES.
      </text>
    </g>

    <!-- Subheadline -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#cbd5e1" opacity="0.95">
      The open citizen action forum for all of Greater Sudbury.
    </text>

    <!-- Open Input Prompt Box Motif (#2) -->
    <g transform="translate(0, 186)" filter="url(#inputShadow)">
      <!-- Outer input box container -->
      <rect width="520" height="74" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.8" />
      
      <!-- Idea Lightbulb Icon -->
      <g transform="translate(20, 22)">
        <circle cx="15" cy="15" r="15" fill="#10b981" fill-opacity="0.15" />
        <text x="7" y="22" font-size="17">💡</text>
      </g>

      <!-- Input Placeholder Text -->
      <text x="64" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">
        What does your neighborhood need?
      </text>
      <text x="64" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">
        Type any proposal, issue, or priority...
      </text>

      <!-- Blinking Cursor Bar -->
      <rect x="336" y="42" width="2" height="15" fill="#34d399" rx="1" />

      <!-- Mini "+ Submit" Pill inside input box -->
      <g transform="translate(416, 17)">
        <rect width="88" height="40" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="44" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">
          + Submit
        </text>
      </g>
    </g>

    <!-- Breadth Tagline / Any-Topic Pills -->
    <g transform="translate(0, 276)">
      <text x="260" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.4">
        Roads • Taxes • Transit • Arenas • Housing • Parks • <tspan fill="#34d399" font-weight="700">+ Any Issue</tspan>
      </text>
    </g>

    <!-- Large CTA Button -->
    <g transform="translate(0, 326)" filter="url(#btnShadow)">
      <rect width="520" height="64" rx="18" fill="url(#btnGradient)" />
      <!-- Button Text -->
      <text x="260" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#022c22" text-anchor="middle" letter-spacing="0.5">
        HAVE YOUR SAY &amp; SECOND IDEAS →
      </text>
    </g>

    <!-- Footer URL & Attribution -->
    <g transform="translate(0, 424)">
      <!-- Divider -->
      <line x1="0" y1="0" x2="520" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
      
      <text x="0" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
        sudburyvotes.info/priorities
      </text>
      <text x="520" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="end">
        Greater Sudbury Civic Archive &amp; 2026 Hub
      </text>
    </g>
  </g>
</svg>
