<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Left Header Pill / Civic Tag -->
  <g transform="translate(60, 60)">
    <rect width="320" height="38" rx="19" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="20" cy="19" r="5" fill="#34d399" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">CITY OF GREATER SUDBURY</text>
  </g>

  <!-- Main Headline & Narrative -->
  <g transform="translate(60, 150)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      SUDBURY HISTORICAL VOTES
    </text>
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#34d399" letter-spacing="-0.5">
      Certified Returns (2003–2022) &amp; 2026 Campaign Hub
    </text>
    <text y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" width="600">
      Official election archive featuring all 12 City Council wards, Mayoral returns,
    </text>
    <text y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      historical multi-cycle candidate trajectories, and the 2026 candidate registry.
    </text>
  </g>

  <!-- Key Metric Badges on Left -->
  <g transform="translate(60, 390)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect width="150" height="90" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">ELECTION YEARS</text>
      <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#ffffff">6 Cycles</text>
      <text x="96" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#34d399">2003–22</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(165, 0)">
      <rect width="150" height="90" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">CITY WARDS</text>
      <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#ffffff">12 Wards</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(330, 0)">
      <rect width="180" height="90" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">UPCOMING ELECTION</text>
      <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#34d399">Oct 26, 2026</text>
    </g>
  </g>

  <!-- Right Visual: Stylized Map Polygon Silhouette Card -->
  <g transform="translate(680, 80)">
    <!-- Glass card backing -->
    <rect width="460" height="470" rx="24" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />

    <!-- Map Title -->
    <text x="30" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Interactive Ward Boundary Map</text>
    <text x="30" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b">Greater Sudbury Geographic Districts (Wards 1–12)</text>

    <!-- Stylized Ward Polygons -->
    <g transform="translate(30, 90)">
      <!-- Ward 1 -->
      <polygon points="120,40 180,30 190,90 130,100" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5" />
      <text x="145" y="70" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W1</text>

      <!-- Ward 2 -->
      <polygon points="30,80 120,40 130,100 50,150" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-width="1.5" />
      <text x="75" y="100" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W2</text>

      <!-- Ward 3 -->
      <polygon points="40,160 130,110 140,180 50,220" fill="#10b981" fill-opacity="0.28" stroke="#34d399" stroke-width="1.5" />
      <text x="80" y="175" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W3</text>

      <!-- Ward 4 -->
      <polygon points="140,110 200,100 210,160 150,170" fill="#10b981" fill-opacity="0.35" stroke="#34d399" stroke-width="1.5" />
      <text x="165" y="145" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W4</text>

      <!-- Ward 5 -->
      <polygon points="190,30 270,20 280,80 200,90" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5" />
      <text x="230" y="60" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W5</text>

      <!-- Ward 6 -->
      <polygon points="210,95 285,85 295,145 220,155" fill="#10b981" fill-opacity="0.32" stroke="#34d399" stroke-width="1.5" />
      <text x="245" y="125" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W6</text>

      <!-- Ward 7 -->
      <polygon points="275,15 380,10 390,120 290,80" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5" />
      <text x="330" y="65" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W7</text>

      <!-- Ward 8 -->
      <polygon points="150,180 220,165 230,230 160,245" fill="#10b981" fill-opacity="0.4" stroke="#34d399" stroke-width="1.5" />
      <text x="180" y="210" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W8</text>

      <!-- Ward 9 -->
      <polygon points="230,160 380,130 395,260 240,240" fill="#10b981" fill-opacity="0.22" stroke="#34d399" stroke-width="1.5" />
      <text x="300" y="200" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W9</text>

      <!-- Ward 10 -->
      <polygon points="160,250 235,235 240,300 165,315" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="1.5" />
      <text x="190" y="280" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W10</text>

      <!-- Ward 11 -->
      <polygon points="240,245 305,240 310,310 245,315" fill="#10b981" fill-opacity="0.38" stroke="#34d399" stroke-width="1.5" />
      <text x="265" y="280" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">W11</text>

      <!-- Ward 12 -->
      <polygon points="135,115 155,110 160,165 140,170" fill="#34d399" fill-opacity="0.5" stroke="#34d399" stroke-width="2" />
      <text x="140" y="145" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">W12</text>
    </g>

    <!-- Mini Bottom Status Pill in Map -->
    <g transform="translate(30, 415)">
      <rect width="400" height="32" rx="10" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <text x="200" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">
        Turnout • Margins • Council Trajectories • Certified Clerk Records
      </text>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(60, 565)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
      SUDBURY MUNICIPAL ELECTIONS • CITY CLERK VERIFIED ARCHIVE
    </text>
  </g>
</svg>
