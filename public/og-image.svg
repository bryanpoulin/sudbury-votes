<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Emerald Header Gradient -->
    <linearGradient id="ogEmeraldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="ogBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glows -->
    <radialGradient id="ogGlowTopRight" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ogGlowBottomLeft" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="ogGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />
    </pattern>

    <!-- Shadows -->
    <filter id="ogShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="ogBtnShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBgGrad)" />
  <rect width="1200" height="630" fill="url(#ogGrid)" />
  <rect width="1200" height="630" fill="url(#ogGlowTopRight)" />
  <rect width="1200" height="630" fill="url(#ogGlowBottomLeft)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="28" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.8" />

  <!-- Container -->
  <g transform="translate(65, 50)">
    
    <!-- Top Bar: Board Label & All 12 Wards -->
    <g>
      <rect x="0" y="0" width="370" height="42" rx="21" fill="#0f172a" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.7" />
      <!-- Pulsing Green Dot -->
      <circle cx="24" cy="21" r="6" fill="#34d399" />
      <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#34d399" letter-spacing="1.4">
        COMMUNITY PRIORITIES BOARD
      </text>

      <!-- All 12 Wards Badge -->
      <text x="1070" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#94a3b8" letter-spacing="1.5" text-anchor="end">
        ALL 12 WARDS • GREATER SUDBURY
      </text>
    </g>

    <!-- Main Catchy Headline -->
    <g transform="translate(0, 95)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
        YOUR WARD. YOUR VOICE.
      </text>
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="900" fill="url(#ogEmeraldText)" letter-spacing="-0.5">
        YOUR PRIORITIES.
      </text>
    </g>

    <!-- Subheadline -->
    <text x="0" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1" opacity="0.95">
      The open citizen action forum for all of Greater Sudbury. Propose, second, and shape city priorities.
    </text>

    <!-- Interactive Prompt Box Motif (Wide) -->
    <g transform="translate(0, 240)" filter="url(#ogShadow)">
      <rect width="1070" height="92" rx="22" fill="#0f172a" stroke="#10b981" stroke-width="2.2" stroke-opacity="0.85" />

      <!-- Lightbulb Icon Circle -->
      <g transform="translate(24, 23)">
        <circle cx="23" cy="23" r="23" fill="#10b981" fill-opacity="0.15" />
        <g transform="translate(11, 11)" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
          <path d="M9 18h6" />
          <path d="M10 22h4" />
        </g>
      </g>

      <!-- Input Placeholder Text -->
      <text x="88" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">
        What does your neighborhood need?
      </text>
      <text x="88" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
        Type any proposal, issue, or priority across your ward...
      </text>

      <!-- Blinking Cursor Bar -->
      <rect x="525" y="53" width="2.5" height="18" fill="#34d399" rx="1.2" />

      <!-- Action Pill inside prompt box -->
      <g transform="translate(890, 20)">
        <rect width="156" height="52" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="78" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#34d399" text-anchor="middle">
          + Submit Idea
        </text>
      </g>
    </g>

    <!-- Topics Breadth Bar -->
    <g transform="translate(0, 360)">
      <text x="535" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
        Roads &amp; Potholes • Taxes &amp; Budget • Transit • Arenas • Housing • Parks • <tspan fill="#34d399" font-weight="800">+ Any Issue in Your Ward</tspan>
      </text>
    </g>

    <!-- Large CTA Button -->
    <g transform="translate(0, 395)" filter="url(#ogBtnShadow)">
      <rect width="1070" height="74" rx="20" fill="url(#ogBtnGrad)" />
      <!-- Button Text -->
      <text x="535" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="900" fill="#022c22" text-anchor="middle" letter-spacing="0.8">
        HAVE YOUR SAY &amp; SECOND IDEAS →
      </text>
    </g>

    <!-- Footer URL & Attribution -->
    <g transform="translate(0, 510)">
      <!-- Divider Line -->
      <line x1="0" y1="0" x2="1070" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

      <text x="0" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="800" fill="#38bdf8" letter-spacing="0.8">
        sudburyvotes.info/priorities
      </text>
      <text x="1070" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#64748b" text-anchor="end">
        Greater Sudbury Civic Archive &amp; 2026 Action Hub
      </text>
    </g>

  </g>
</svg>
