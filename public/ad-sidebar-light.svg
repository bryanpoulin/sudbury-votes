<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Light Background Gradient -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Emerald Header Gradient -->
    <linearGradient id="lightEmeraldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="lightBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="lightInputShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <filter id="lightBtnShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#lightBg)" rx="24" />

  <!-- Outer Border (clean 2px slate border) -->
  <rect x="2" y="2" width="596" height="596" rx="22" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <!-- Content Container -->
  <g transform="translate(40, 42)">
    
    <!-- Top Pill / Status Bar -->
    <g>
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-opacity="0.6" />
      <!-- Green Indicator Dot -->
      <circle cx="20" cy="17" r="5" fill="#059669" />
      <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="1.2">
        COMMUNITY PRIORITIES BOARD
      </text>
    </g>

    <!-- All 12 Wards Badge -->
    <text x="520" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5" text-anchor="end">
      ALL 12 WARDS
    </text>

    <!-- Headline -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
        YOUR WARD. YOUR VOICE.
      </text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="41" font-weight="900" fill="url(#lightEmeraldText)" letter-spacing="-0.5">
        YOUR PRIORITIES.
      </text>
    </g>

    <!-- Subheadline -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#475569">
      The open citizen action forum for all of Greater Sudbury.
    </text>

    <!-- Open Input Prompt Box Motif (#2) -->
    <g transform="translate(0, 186)" filter="url(#lightInputShadow)">
      <!-- Outer input box container -->
      <rect width="520" height="74" rx="18" fill="#ffffff" stroke="#059669" stroke-width="1.8" />
      
      <!-- Idea Lightbulb Icon -->
      <g transform="translate(20, 22)">
        <circle cx="15" cy="15" r="15" fill="#ecfdf5" />
        <text x="7" y="22" font-size="17">💡</text>
      </g>

      <!-- Input Placeholder Text -->
      <text x="64" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">
        What does your neighborhood need?
      </text>
      <text x="64" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">
        Type any proposal, issue, or priority...
      </text>

      <!-- Blinking Cursor Bar -->
      <rect x="336" y="42" width="2" height="15" fill="#059669" rx="1" />

      <!-- Mini "+ Submit" Pill inside input box -->
      <g transform="translate(416, 17)">
        <rect width="88" height="40" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
        <text x="44" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">
          + Submit
        </text>
      </g>
    </g>

    <!-- Breadth Tagline / Any-Topic Pills -->
    <g transform="translate(0, 276)">
      <text x="260" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.4">
        Roads • Taxes • Transit • Arenas • Housing • Parks • <tspan fill="#047857" font-weight="800">+ Any Issue</tspan>
      </text>
    </g>

    <!-- Large CTA Button -->
    <g transform="translate(0, 326)" filter="url(#lightBtnShadow)">
      <rect width="520" height="64" rx="18" fill="url(#lightBtnGrad)" />
      <!-- Button Text -->
      <text x="260" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        HAVE YOUR SAY &amp; SECOND IDEAS →
      </text>
    </g>

    <!-- Footer URL & Attribution -->
    <g transform="translate(0, 424)">
      <!-- Divider -->
      <line x1="0" y1="0" x2="520" y2="0" stroke="#e2e8f0" stroke-width="1.5" />
      
      <text x="0" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#0284c7" letter-spacing="0.5">
        sudburyvotes.info/priorities
      </text>
      <text x="520" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">
        Greater Sudbury Civic Archive &amp; 2026 Hub
      </text>
    </g>
  </g>
</svg>
