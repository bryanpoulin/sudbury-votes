<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="glowTopRight" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="15%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <pattern id="civicGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#civicGrid)" />
  <rect width="1200" height="630" fill="url(#glowTopRight)" />
  <rect width="1200" height="630" fill="url(#glowBottomLeft)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.7" />

  <!-- Top Badges Bar -->
  <g transform="translate(64, 60)">
    <!-- Pill 1: City & Campaign -->
    <rect width="360" height="40" rx="20" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="22" cy="20" r="6" fill="#34d399" />
    <text x="40" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#a7f3d0" letter-spacing="1.5">2026 GREATER SUDBURY CIVIC PULSE</text>

    <!-- Pill 2: Integrity & 12 Wards -->
    <g transform="translate(680, 0)">
      <rect width="390" height="40" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#475569" stroke-width="1.5" stroke-opacity="0.7" />
      <circle cx="22" cy="20" r="5" fill="#fbbf24" />
      <text x="38" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="1.2">100% ANONYMOUS • ALL 12 WARDS</text>
    </g>
  </g>

  <!-- Main Question & Title -->
  <g transform="translate(64, 142)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.2">
      WHERE DO YOU STAND?
    </text>
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#34d399" letter-spacing="-0.5">
      2026 Greater Sudbury Civic Stance Poll
    </text>
    <text y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Cast your anonymous ballot on the 4 key issues driving the upcoming municipal election:
    </text>
  </g>

  <!-- 4 Issue Cards Grid (2x2) -->
  <g transform="translate(64, 275)">
    <!-- CARD 1: Event Centre -->
    <g transform="translate(0, 0)">
      <rect width="520" height="102" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="8" height="102" rx="4" fill="#38bdf8" />
      <!-- Icon badge -->
      <rect x="22" y="20" width="38" height="38" rx="10" fill="#0284c7" fill-opacity="0.2" />
      <text x="41" y="44" font-family="sans-serif" font-size="20" text-anchor="middle">🏟️</text>
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="1">PRIORITY 1</text>
      <text x="74" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Downtown Event Centre</text>
      <text x="74" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Arena replacement vs. refurbish vs. private partner vs. referendum</text>
    </g>

    <!-- CARD 2: Roads & Infrastructure -->
    <g transform="translate(550, 0)">
      <rect width="520" height="102" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="8" height="102" rx="4" fill="#fbbf24" />
      <!-- Icon badge -->
      <rect x="22" y="20" width="38" height="38" rx="10" fill="#d97706" fill-opacity="0.2" />
      <text x="41" y="44" font-family="sans-serif" font-size="20" text-anchor="middle">🛣️</text>
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" letter-spacing="1">PRIORITY 2</text>
      <text x="74" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Roads &amp; Infrastructure</text>
      <text x="74" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Target asset deficit vs. surface lifecycle vs. transit &amp; active transport</text>
    </g>

    <!-- CARD 3: Homelessness & Housing -->
    <g transform="translate(0, 120)">
      <rect width="520" height="102" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="8" height="102" rx="4" fill="#ec4899" />
      <!-- Icon badge -->
      <rect x="22" y="20" width="38" height="38" rx="10" fill="#db2777" fill-opacity="0.2" />
      <text x="41" y="44" font-family="sans-serif" font-size="20" text-anchor="middle">🏠</text>
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ec4899" letter-spacing="1">PRIORITY 3</text>
      <text x="74" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Homelessness &amp; Addictions</text>
      <text x="74" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Transitional housing &amp; mental health vs. public safety enforcement</text>
    </g>

    <!-- CARD 4: Taxes & Services -->
    <g transform="translate(550, 120)">
      <rect width="520" height="102" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="8" height="102" rx="4" fill="#34d399" />
      <!-- Icon badge -->
      <rect x="22" y="20" width="38" height="38" rx="10" fill="#059669" fill-opacity="0.2" />
      <text x="41" y="44" font-family="sans-serif" font-size="20" text-anchor="middle">💰</text>
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#34d399" letter-spacing="1">PRIORITY 4</text>
      <text x="74" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Taxes &amp; Core Municipal Services</text>
      <text x="74" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Cap property tax at inflation vs. maintain services &amp; invest in growth</text>
    </g>
  </g>

  <!-- Footer Call to Action -->
  <g transform="translate(64, 535)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="0.5">
      Independent Civic Research • Real-time Certified Returns &amp; Stance Breakdown
    </text>

    <!-- Action Pill Button -->
    <g transform="translate(730, -22)">
      <rect width="340" height="48" rx="16" fill="#34d399" />
      <text x="170" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#022c22" text-anchor="middle" letter-spacing="0.5">
        CAST YOUR BALLOT NOW →
      </text>
    </g>
  </g>
</svg>
